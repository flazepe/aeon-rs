[package]
name = "aeon-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23"
csscolorparser = "0.9"
futures = "0.3"
gouth = "0.2"
headless_chrome = "1"
http_req = "0.14"
image = "0.25"
mathjax-svg-rs = { version = "0.4" }
mongodb = "3"
nipper = "0.1"
parse_duration = "2.1"
prost = "0.14"
redis = { version = "1", features = ["tokio-comp"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "form", "json", "query"] }
resvg = "0.48"
serde = "1"
serde_json = "1"
serde_repr = "0.1"
serde_with = "3"
similar = "3"
slashook = { git = "https://github.com/tonkku107/slashook.git", rev = "ba19238" }
sysinfo = "0.39"
tokio = "1"
toml = "1"
tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"
unicode_names2 = "4"

[build-dependencies]
tonic-prost-build = "0.14"
